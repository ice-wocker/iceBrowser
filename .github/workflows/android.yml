name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，这里只补齐 build-tools / platform。
      # 不要用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除该 package，会直接失败。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 纯 JVM 单测放在构建前：规则解析错了不必等 APK 打完才知道
      - name: Run unit tests
        run: ./run-tests.sh

      - name: Build APK
        run: ./build.sh

      - name: Verify APK is signed and installable
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify icebrowser.apk
          "$BT/aapt" dump badging icebrowser.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: icebrowser.apk
          if-no-files-found: error

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: icebrowser.apk
          generate_release_notes: true
          draft: false
