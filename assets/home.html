<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<meta name="theme-color" content="#1A73E8" id="themeColorMeta">
<title>ice 浏览器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ===== 主题变量(四套主题) ===== */
:root {
    --bg: #FFFFFF;
    --fg: #202124;
    --muted: #5F6368;
    --subtle: #9AA0A6;
    --border: rgba(0, 0, 0, 0.06);
    --border-strong: #DADCE0;
    --surface: #F1F3F4;
    --card: #FFFFFF;
    --card2: #F8F9FA;
    --hover: rgba(0, 0, 0, 0.04);
    --accent: #1A73E8;
    --accent-2: #1557B0;
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(26, 115, 232, 0.3);
    --icon: #5F6368;
    --topbar: rgba(255, 255, 255, 0.95);
    --result-title: #1A0DAB;
    --shadow: rgba(0, 0, 0, 0.12);
    --logo: #1A73E8;
}
body.dark {
    --bg: #202124;
    --fg: #E8EAED;
    --muted: #9AA0A6;
    --subtle: #9AA0A6;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: #5F6368;
    --surface: #3C4043;
    --card: #2D2E30;
    --card2: #3C4043;
    --hover: rgba(255, 255, 255, 0.08);
    --accent: #8AB4F8;
    --accent-2: #AECBFA;
    --accent-fg: #202124;
    --accent-soft: rgba(138, 180, 248, 0.4);
    --icon: #BDC1C6;
    --topbar: rgba(32, 33, 36, 0.95);
    --result-title: #8AB4F8;
    --shadow: rgba(0, 0, 0, 0.4);
    --logo: #8AB4F8;
}
body.sepia {
    --bg: #F4ECD8;
    --fg: #4B3B2A;
    --muted: #8A7355;
    --subtle: #A08B6A;
    --border: rgba(90, 70, 40, 0.14);
    --border-strong: #D8C9A8;
    --surface: #EADFC4;
    --card: #FBF5E6;
    --card2: #EFE4CB;
    --hover: rgba(120, 90, 50, 0.08);
    --accent: #A0522D;
    --accent-2: #8B4513;
    --accent-fg: #FFFFFF;
    --accent-soft: rgba(160, 82, 45, 0.35);
    --icon: #7A6448;
    --topbar: rgba(244, 236, 216, 0.95);
    --result-title: #8B4513;
    --shadow: rgba(90, 70, 40, 0.2);
    --logo: #A0522D;
}
body.contrast {
    --bg: #000000;
    --fg: #FFFFFF;
    --muted: #B0B0B0;
    --subtle: #8A8A8A;
    --border: rgba(255, 255, 255, 0.18);
    --border-strong: #4D4D4D;
    --surface: #101010;
    --card: #0A0A0A;
    --card2: #141414;
    --hover: rgba(255, 255, 255, 0.12);
    --accent: #4DA3FF;
    --accent-2: #82B1FF;
    --accent-fg: #000000;
    --accent-soft: rgba(77, 163, 255, 0.5);
    --icon: #D0D0D0;
    --topbar: rgba(0, 0, 0, 0.95);
    --result-title: #82B1FF;
    --shadow: rgba(0, 0, 0, 0.8);
    --logo: #4DA3FF;
}

html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.2s, color 0.2s;
}

/* 顶部 */
.top-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; height: 56px;
    background: var(--topbar);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}
body.incognito .top-bar { border-bottom-color: rgba(124, 77, 255, 0.6); }

.logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 600;
    color: var(--logo);
    user-select: none; cursor: pointer;
}
.logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #1A73E8 0%, #4285F4 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px; font-weight: bold;
    box-shadow: 0 2px 8px rgba(26, 115, 232, 0.3);
}
body.incognito .logo-icon { background: linear-gradient(135deg, #7C4DFF 0%, #B388FF 100%); }

.tab-count {
    background: var(--accent);
    color: var(--accent-fg);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    margin-left: 4px;
    min-width: 24px;
    text-align: center;
}

.badge-incognito {
    display: none;
    margin-left: 6px; padding: 2px 8px;
    background: rgba(124, 77, 255, 0.15);
    color: #7C4DFF;
    border: 1px solid rgba(124, 77, 255, 0.5);
    border-radius: 12px; font-size: 11px; font-weight: 600;
}
body.incognito .badge-incognito { display: inline-block; }
body.contrast.incognito .badge-incognito { color: #B388FF; }

.top-actions { display: flex; gap: 4px; }
.icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: transparent; border: none; color: var(--icon);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
}
.icon-btn:hover, .icon-btn:active { background: var(--hover); }
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
.icon-btn.bm-on { color: var(--accent); }

/* 主体 */
.main { max-width: 720px; margin: 0 auto; padding: 0 16px; }

/* 标题 */
.hero { padding: 60px 0 24px 0; text-align: center; }
.hero-title {
    font-size: 56px; font-weight: 700;
    background: linear-gradient(135deg, #1A73E8 0%, #4285F4 50%, #34A853 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 8px; letter-spacing: -1px; line-height: 1.1;
}
.hero-tagline { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

/* 搜索框 */
.search-container { position: relative; margin-bottom: 16px; }
.search-box {
    display: flex; align-items: center;
    background: var(--surface); border-radius: 28px;
    padding: 0 8px 0 20px; height: 56px;
    transition: box-shadow 0.2s, background 0.2s;
    border: 1px solid transparent;
}
.search-box:focus-within {
    background: var(--card);
    box-shadow: 0 2px 12px var(--shadow), 0 0 0 1px var(--accent-soft);
}
.engine-icon {
    width: 24px; height: 24px;
    margin-right: 12px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 13px;
    background: #4285F4;
}
.search-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 16px; color: inherit; font-family: inherit;
    padding: 0 8px; min-width: 0;
}
.search-input::placeholder { color: var(--subtle); }
.search-btn {
    background: var(--accent); color: var(--accent-fg); border: none;
    height: 40px; padding: 0 18px; border-radius: 20px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    margin-left: 4px; font-family: inherit;
}
.search-btn:hover { background: var(--accent-2); }
.search-btn:active { transform: scale(0.97); }
.search-btn:disabled { background: var(--subtle); }

/* 引擎 */
.engine-tabs {
    display: flex; gap: 4px; margin-bottom: 24px; padding: 4px;
    background: var(--surface); border-radius: 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.engine-tabs::-webkit-scrollbar { display: none; }
.engine-tab {
    flex-shrink: 0; padding: 8px 14px;
    background: transparent; border: none; color: var(--muted);
    font-size: 13px; font-weight: 500; border-radius: 16px;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background 0.2s, color 0.2s;
}
.engine-tab.active { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px var(--shadow); }

/* 建议 */
.suggestions {
    position: absolute; top: 56px; left: 0; right: 0;
    background: var(--card); border-radius: 16px;
    box-shadow: 0 4px 24px var(--shadow);
    z-index: 50; display: none; overflow: hidden;
    max-height: 360px; overflow-y: auto;
}
.suggestions.show { display: block; }
.suggestion-item {
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
    cursor: pointer; border-bottom: 1px solid var(--surface);
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover, .suggestion-item.active { background: var(--card2); }
.suggestion-icon { color: var(--subtle); flex-shrink: 0; }
.suggestion-icon svg { width: 18px; height: 18px; fill: currentColor; }
.suggestion-text { flex: 1; font-size: 15px; word-break: break-all; }
.suggestion-text mark { color: var(--accent); font-weight: 600; background: transparent; }
.suggestion-type { font-size: 11px; color: var(--subtle); padding: 2px 6px; background: var(--surface); border-radius: 4px; }

/* 最近搜索 */
.recent-section { margin-top: 4px; margin-bottom: 8px; }
.recent-list { display: flex; flex-wrap: wrap; gap: 8px; }
.recent-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 6px 6px 14px;
    background: var(--surface); border-radius: 18px;
    color: var(--fg); font-size: 13px; cursor: pointer;
    border: none; font-family: inherit; max-width: 100%;
}
.recent-chip:hover { background: var(--hover); }
.recent-chip .recent-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.recent-del {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; line-height: 1; flex-shrink: 0;
}
.recent-del:hover { background: rgba(229, 57, 53, 0.15); color: #E53935; }

/* 快捷方式 */
.shortcuts-section { margin-top: 24px; padding-bottom: 40px; }
.section-title {
    font-size: 13px; color: var(--muted); font-weight: 500;
    margin-bottom: 12px; padding-left: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: space-between;
}
.edit-link {
    color: var(--accent); font-size: 12px; cursor: pointer;
    text-transform: none; letter-spacing: 0;
}
.shortcuts-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.shortcut {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 8px; background: transparent;
    border-radius: 12px; color: inherit; cursor: pointer;
    border: none; font-family: inherit;
    transition: background 0.2s;
}
.shortcut:hover, .shortcut:active { background: var(--hover); }
.shortcut-icon {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px; font-weight: bold;
    margin-bottom: 8px; background: #5F6368;
}
.shortcut-name { font-size: 12px; text-align: center; word-break: break-all; }
.shortcut-del {
    display: none;
    position: absolute; top: 2px; right: 2px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #E53935; color: #FFFFFF;
    align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; z-index: 2;
    border: 2px solid var(--bg);
}
.shortcut:hover .shortcut-del { display: flex; }
.edit-mode .shortcut { position: relative; }
.edit-mode .shortcut::after {
    content: '\00D7'; position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #E53935; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
}
.add-shortcut { border: 2px dashed var(--border-strong); background: transparent; }
.add-shortcut-icon { background: transparent !important; border: 2px dashed var(--border-strong); color: var(--icon) !important; }

/* 抽屉 */
.drawer-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.5); z-index: 200;
    display: none; backdrop-filter: blur(2px);
}
.drawer-overlay.show { display: block; }
.drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 300px; max-width: 85%;
    background: var(--card); z-index: 201;
    transform: translateX(-100%); transition: transform 0.3s;
    overflow-y: auto;
    box-shadow: 2px 0 8px var(--shadow);
    display: none;
}
.drawer.show { transform: translateX(0); display: block; }
.drawer-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
}
.drawer-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.drawer-subtitle { font-size: 12px; color: var(--muted); }
.drawer-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
.drawer-item {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; color: inherit;
    text-decoration: none; cursor: pointer;
    background: transparent; border: none; width: 100%;
    text-align: left; font-family: inherit; font-size: 15px;
}
.drawer-item:hover, .drawer-item:active { background: var(--card2); }
.drawer-item-icon { width: 24px; height: 24px; color: var(--icon); flex-shrink: 0; }
.drawer-item-icon svg { width: 24px; height: 24px; fill: currentColor; }
.drawer-item-label { flex: 1; }
.drawer-item-counter {
    background: var(--surface); color: var(--muted);
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
}
.drawer-list { padding: 0 8px; }
.drawer-list-item {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none; cursor: pointer;
    font-family: inherit; color: var(--fg);
    padding: 8px 12px; border-radius: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px;
}
.drawer-list-item:hover, .drawer-list-item:active { background: var(--card2); }
.drawer-list-item .drawer-list-domain { color: var(--muted); font-size: 11px; margin-left: 6px; }
.drawer-empty { padding: 8px 12px; font-size: 12px; color: var(--subtle); }

/* 主题 */
.theme-picker { display: flex; gap: 8px; padding: 8px 20px; }
.theme-option {
    flex: 1; padding: 8px 4px;
    border: 1px solid var(--border-strong); border-radius: 8px;
    background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12px; color: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.theme-option.active { border-color: var(--accent); border-width: 2px; }
.theme-color { width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(0, 0, 0, 0.1); }

/* 底部 */
.footer { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 12px; }
.footer a { color: inherit; text-decoration: none; }

/* 搜索结果 (ice 自研) */
.results { margin-top: 24px; }
.results-info { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.result {
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}
.result-url {
    font-size: 12px; color: var(--muted); margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
}
.result-domain {
    background: var(--accent); color: var(--accent-fg); font-size: 10px;
    padding: 1px 6px; border-radius: 4px; font-weight: 500;
    flex-shrink: 0;
}
.result-url-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-title {
    font-size: 18px; color: var(--result-title);
    text-decoration: none; font-weight: 400;
    line-height: 1.3; display: block; margin-bottom: 4px;
}
.result-title:hover { text-decoration: underline; }
.result-snippet { font-size: 14px; color: var(--muted); line-height: 1.5; }
.result-actions { display: flex; gap: 8px; margin-top: 6px; }
.result-action {
    font-size: 12px; color: var(--accent);
    background: transparent; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 4px; font-family: inherit;
}
.result-action:hover { background: var(--hover); }

/* 加载 / 提示 */
.loading { text-align: center; padding: 40px 16px; color: var(--muted); }
body.sepia .loading { color: var(--muted); }
.spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 通知 */
.toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%);
    background: rgba(32, 33, 36, 0.95); color: white;
    padding: 12px 20px; border-radius: 24px;
    font-size: 14px; z-index: 300;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; }

@media (max-width: 480px) {
    .hero { padding: 40px 0 20px 0; }
    .hero-title { font-size: 44px; }
}
@media (max-width: 360px) {
    .hero { padding: 28px 0 14px 0; }
    .hero-title { font-size: 36px; }
    .shortcuts-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .search-btn { padding: 0 12px; }
    .top-actions .icon-btn { width: 36px; height: 36px; }
}
</style>
</head>
<body>

<!-- 顶部条 -->
<div class="top-bar">
    <div class="logo" onclick="toggleDrawer()" role="button" tabindex="0" aria-label="打开菜单">
        <div class="logo-icon">i</div>
        <span>ice</span>
        <span class="tab-count" id="tab_count" aria-label="标签页数量">1</span>
        <span class="badge-incognito" id="incognitoBadge" aria-label="无痕模式">无痕</span>
    </div>
    <div class="top-actions">
        <button class="icon-btn" id="bmBtn" onclick="toggleBookmark()" aria-label="收藏本页" title="收藏本页">
            <svg viewBox="0 0 24 24"><path id="bmPath" d="M17,3H7C5.89,3 5,3.9 5,5V21L12,18L19,21V5C19,3.9 18.11,3 17,3M17,5V18L12,15.82L7,18V5H17Z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" aria-label="切换主题" title="切换主题">
            <svg viewBox="0 0 24 24"><path d="M12,18V6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,15.31L23.31,12L20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31Z"/></svg>
        </button>
        <button class="icon-btn" onclick="openTranslate()" aria-label="翻译" title="翻译">
            <svg viewBox="0 0 24 24"><path d="M12.87,15.07L10.33,12.56L10.36,12.53C12.1,10.59 13.34,8.36 14.07,6H17V4H10V2H8V4H1V6H12.17C11.5,7.92 10.44,9.75 9,11.35C8.07,10.32 7.3,9.19 6.69,8H4.5C5.3,9.5 6.27,10.91 7.41,12.18L2.5,17.04L4,18.5L9,13.5L12.5,17L12.87,15.07M18.5,10H16.5L12,22H14L15.12,19H19.87L21,22H23L18.5,10M15.88,17L17.5,12.67L19.12,17H15.88Z"/></svg>
        </button>
    </div>
</div>

<!-- 主体 -->
<div class="main">
    <div class="hero" id="hero">
        <div class="hero-title">ice</div>
        <div class="hero-tagline">纯净 · 快速 · 自研搜索引擎</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-container">
        <form class="search-box" id="searchForm" onsubmit="return doSearch(event)">
            <div class="engine-icon" id="engineIcon">i</div>
            <input type="text" class="search-input" id="searchInput"
                   placeholder="搜索或输入网址..."
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   aria-label="搜索框"
                   oninput="onSearchInput()" onfocus="onSearchFocus()"
                   onkeydown="onSearchKeydown(event)">
            <button type="submit" class="search-btn" id="searchBtn" aria-label="搜索">搜索</button>
        </form>
        <div class="suggestions" id="suggestions" role="listbox" aria-label="搜索建议"></div>
    </div>

    <!-- 引擎切换 -->
    <div class="engine-tabs" id="engineTabs" role="tablist" aria-label="搜索引擎"></div>

    <!-- 最近搜索 -->
    <div class="recent-section" id="recentSection" style="display:none">
        <div class="section-title">
            <span>最近搜索</span>
            <span class="edit-link" id="recent_clear" onclick="clearRecent()" role="button" tabindex="0">清空全部</span>
        </div>
        <div class="recent-list" id="recentList"></div>
    </div>

    <!-- 搜索结果 -->
    <div class="results" id="results" aria-live="polite"></div>

    <!-- 快捷方式 -->
    <div class="shortcuts-section" id="shortcutsSection">
        <div class="section-title">
            <span>常用网站</span>
            <span class="edit-link" id="edit_link" onclick="toggleEditMode()" role="button" tabindex="0">编辑</span>
        </div>
        <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </div>

<script>
// ===================== 状态 =====================
// 引擎以原生契约中的名称为 key，便于与 getSearchEngine/setSearchEngine 直接同步
var engines = {
    'ice': { name: 'ice', icon: 'i', color: '#1A73E8', url: null },
    'Bing': { name: 'Bing', icon: 'B', color: '#008373', url: 'https://www.bing.com/search?q=' },
    'Google': { name: 'Google', icon: 'G', color: '#4285F4', url: 'https://www.google.com/search?q=' },
    'DuckDuckGo': { name: 'DuckDuckGo', icon: 'D', color: '#DE5833', url: 'https://duckduckgo.com/?q=' },
    '百度': { name: '百度', icon: '百', color: '#2932E1', url: 'https://www.baidu.com/s?wd=' },
    '搜狗': { name: '搜狗', icon: 'S', color: '#FF6F00', url: 'https://www.sogou.com/web?query=' }
};
var engineOrder = ['ice', 'Bing', 'Google', 'DuckDuckGo', '百度', '搜狗'];

var defaultShortcuts = [
    { name: '百度', url: 'https://www.baidu.com', icon: '百', color: '#2932E1' },
    { name: '知乎', url: 'https://www.zhihu.com', icon: '知', color: '#0084FF' },
    { name: 'Bilibili', url: 'https://www.bilibili.com', icon: 'B', color: '#FB7299' },
    { name: 'GitHub', url: 'https://github.com', icon: 'G', color: '#24292E' },
    { name: '淘宝', url: 'https://www.taobao.com', icon: '淘', color: '#FF4200' },
    { name: '微博', url: 'https://weibo.com', icon: '微', color: '#E6162D' },
    { name: '豆瓣', url: 'https://www.douban.com', icon: '豆', color: '#2E963D' },
    { name: '掘金', url: 'https://juejin.cn', icon: '掘', color: '#1E80FF' }
];

function readJSON(key, fallback) {
    try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        var v = JSON.parse(raw);
        return v === null ? fallback : v;
    } catch (e) { return fallback; }
}

var state = {
    theme: 'auto',
    editMode: false,
    incognito: false,
    shortcuts: readJSON('ice_shortcuts', null) || defaultShortcuts.slice(0),
    recent: readJSON('ice_recent', [])
};

var currentEngine = 'ice';
var lastQuery = '';
var debounceTimer = null;
var callbackSeq = 0;
var callbacks = {};
var sugItems = [];
var sugIndex = -1;
var longPressTimer = null;

// ===================== 工具函数 =====================
function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

function pad6(n) {
    var s = Math.floor(n).toString(16);
    while (s.length < 6) s = '0' + s;
    return s;
}

function makeCallbackId(prefix) {
    callbackSeq++;
    return prefix + '_' + Date.now() + '_' + callbackSeq;
}

function showToast(msg) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2000);
}

function isNative(method) {
    return !!(window.IceJsBridge && window.IceJsBridge[method]);
}

// ===================== 主题 =====================
function normalizeTheme(t) {
    if (!t) return null;
    var v = String(t).toLowerCase();
    if (v === 'amoled') v = 'contrast';
    if (v === 'light' || v === 'dark' || v === 'sepia' || v === 'contrast') return v;
    return null;
}

var THEME_COLORS = {
    light: '#FFFFFF',
    dark: '#202124',
    sepia: '#F4ECD8',
    contrast: '#000000'
};

function getAutoTheme() {
    try {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
    } catch (e) {}
    return 'light';
}

function applyTheme() {
    var t = normalizeTheme(state.theme);
    if (!t || state.theme === 'auto') t = getAutoTheme();
    var body = document.body;
    body.classList.remove('light', 'dark', 'sepia', 'contrast');
    if (t !== 'light') body.classList.add(t);
    var meta = document.getElementById('themeColorMeta');
    if (meta) meta.setAttribute('content', THEME_COLORS[t] || '#1A73E8');
    var opts = document.querySelectorAll('.theme-option');
    for (var i = 0; i < opts.length; i++) {
        if (opts[i].setAttribute) {
            var dt = opts[i].getAttribute('data-theme');
            if (dt === state.theme) opts[i].classList.add('active');
            else opts[i].classList.remove('active');
        }
    }
}

function setTheme(theme) {
    var t = normalizeTheme(theme) || 'light';
    state.theme = t;
    applyTheme();
    try { localStorage.setItem('ice_theme', t); } catch (e) {}
    if (isNative('setTheme')) window.IceJsBridge.setTheme(t);
    showToast('主题已切换');
}

function toggleTheme() {
    var themes = ['light', 'dark', 'sepia', 'contrast'];
    var cur = normalizeTheme(state.theme);
    if (!cur) cur = getAutoTheme();
    var idx = themes.indexOf(cur);
    setTheme(themes[(idx + 1) % themes.length]);
}

function initTheme() {
    var t = null;
    if (isNative('getCurrentTheme')) {
        try { t = normalizeTheme(window.IceJsBridge.getCurrentTheme()); } catch (e) {}
    }
    if (!t) t = normalizeTheme(readJSON('ice_theme', null)) || normalizeTheme(localStorage.getItem('ice_theme'));
    if (!t) t = getAutoTheme();
    state.theme = t;
    applyTheme();
}

// ===================== 搜索引擎 =====================
function normalizeEngineName(n) {
    if (!n) return null;
    var v = String(n).trim().toLowerCase();
    for (var i = 0; i < engineOrder.length; i++) {
        if (engineOrder[i].toLowerCase() === v) return engineOrder[i];
    }
    return null;
}

function updateEngineIcon() {
    var e = engines[currentEngine] || engines['ice'];
    var icon = document.getElementById('engineIcon');
    if (icon) {
        icon.textContent = e.icon;
        icon.style.background = e.color;
    }
}

function renderEngines() {
    var tabs = document.getElementById('engineTabs');
    if (!tabs) return;
    tabs.innerHTML = '';
    for (var i = 0; i < engineOrder.length; i++) {
        (function (key) {
            var e = engines[key];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'engine-tab' + (key === currentEngine ? ' active' : '');
            btn.textContent = e.name;
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-label', '使用 ' + e.name + ' 搜索');
            btn.setAttribute('aria-selected', key === currentEngine ? 'true' : 'false');
            btn.onclick = function () { setEngine(key); };
            tabs.appendChild(btn);
        })(engineOrder[i]);
    }
}

function setEngine(name) {
    var key = normalizeEngineName(name) || 'ice';
    currentEngine = key;
    try { localStorage.setItem('ice_engine', key); } catch (e) {}
    updateEngineIcon();
    renderEngines();
    if (isNative('setSearchEngine')) window.IceJsBridge.setSearchEngine(key);
}

function syncSearchEngine() {
    var name = null;
    if (isNative('getSearchEngine')) {
        try { name = normalizeEngineName(window.IceJsBridge.getSearchEngine()); } catch (e) {}
    }
    if (!name) name = normalizeEngineName(localStorage.getItem('ice_engine'));
    currentEngine = name || 'ice';
    updateEngineIcon();
    renderEngines();
}

// ===================== 搜索 =====================
function isUrl(text) {
    return /^[\w-]+(\.[\w-]+)+/.test(text) && !/\s/.test(text);
}

function normalizeUrl(input) {
    return /^https?:\/\//i.test(input) ? input : 'https://' + input;
}

function externalSearchUrl(engine, query) {
    var e = engines[engine];
    var enc = encodeURIComponent(query);
    if (e && e.url) return e.url + enc;
    return 'https://www.bing.com/search?q=' + enc;
}

function doSearch(event) {
    if (event && event.preventDefault) event.preventDefault();
    var input = document.getElementById('searchInput');
    if (!input) return false;
    var query = input.value.trim();
    if (!query) return false;

    hideSuggestions();
    resetSuggestionIndex();

    if (isUrl(query)) {
        navTo(normalizeUrl(query));
        return false;
    }

    recordRecent(query);

    if (currentEngine === 'ice') {
        doIceSearch(query);
    } else {
        navTo(externalSearchUrl(currentEngine, query));
    }
    return false;
}

function navTo(url) {
    if (isNative('loadUrl')) window.IceJsBridge.loadUrl(url);
    else window.location.href = url;
}

// ice 异步搜索
function doIceSearch(query) {
    var results = document.getElementById('results');
    var hero = document.getElementById('hero');
    var shortcutsSection = document.getElementById('shortcutsSection');

    lastQuery = query;
    if (hero) hero.style.display = 'none';
    if (shortcutsSection) shortcutsSection.style.display = 'none';
    updateRecentVisibility();
    if (results) results.innerHTML = '<div class="loading"><div class="spinner"></div>ice 搜索中...</div>';

    if (!isNative('search')) {
        if (results) results.innerHTML = '<div class="loading">ice 搜索需要 ice 浏览器环境</div>';
        return;
    }

    var cbId = makeCallbackId('sr');
    callbacks[cbId] = function (json) {
        var data;
        try { data = JSON.parse(json); } catch (e) {
            if (results) results.innerHTML = '<div class="loading">解析搜索结果失败</div>';
            return;
        }
        if (data && data.error) {
            if (results) results.innerHTML = '<div class="loading">搜索失败：' + escapeHtml(data.error) + '</div>';
            return;
        }
        var list = (data && data.results) ? data.results : [];
        if (!list.length) {
            if (results) results.innerHTML = '<div class="loading">未找到与「' + escapeHtml(query) + '」相关的结果</div>';
            return;
        }
        var total = (data.total === undefined || data.total === null) ? list.length : data.total;
        var html = '<div class="results-info">ice 搜索为您找到约 ' + escapeHtml(total) + ' 条结果</div>';
        for (var i = 0; i < list.length; i++) {
            html += renderResultCard(list[i]);
        }
        if (results) results.innerHTML = html;
    };
    window.IceJsBridge.search(query, cbId);
}

function renderResultCard(r) {
    r = r || {};
    var url = r.url || '';
    var title = r.title || url;
    var domain = r.domain || '';
    var snippet = r.snippet || '';
    var color = (r.color && /^[0-9A-Fa-f]{3,8}$/.test(r.color)) ? ('#' + r.color) : '';
    var safeUrl = escapeHtml(url);
    return '<div class="result">' +
        '<div class="result-url">' +
            (domain ? '<span class="result-domain"' + (color ? ' style="background:' + color + '"' : '') + '>' + escapeHtml(domain) + '</span>' : '') +
            '<span class="result-url-text">' + escapeHtml(url) + '</span>' +
        '</div>' +
        '<a class="result-title" href="javascript:void(0)" onclick="iceNav(\'' + safeUrl + '\')">' + escapeHtml(title) + '</a>' +
        '<div class="result-snippet">' + escapeHtml(snippet) + '</div>' +
        '<div class="result-actions">' +
            '<button type="button" class="result-action" onclick="iceNav(\'' + safeUrl + '\')" aria-label="打开 ' + escapeHtml(title) + '">打开</button>' +
            '<button type="button" class="result-action" onclick="openInNewTab(\'' + safeUrl + '\')" aria-label="在新标签页打开 ' + escapeHtml(title) + '">新标签打开</button>' +
        '</div>' +
    '</div>';
}

window.iceOnSearchResults = function (json, cbId) {
    var cb = callbacks[cbId];
    if (cb) {
        delete callbacks[cbId];
        cb(json);
    }
};

// ===================== 输入建议 =====================
function onSearchInput() {
    var input = document.getElementById('searchInput');
    updateRecentVisibility();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
        requestSuggestions(input ? input.value : '');
    }, 150);
}

function onSearchFocus() {
    var input = document.getElementById('searchInput');
    if (input && input.value.trim()) requestSuggestions(input.value);
    else hideSuggestions();
    updateRecentVisibility();
}

function requestSuggestions(prefix) {
    prefix = prefix || '';
    if (!isNative('getSuggestions')) {
        renderSuggestions([]);
        return;
    }
    var cbId = makeCallbackId('sg');
    callbacks[cbId] = function (json) {
        var list;
        try { list = JSON.parse(json); } catch (e) { list = []; }
        if (!list || typeof list.length !== 'number') list = [];
        renderSuggestions(list);
    };
    window.IceJsBridge.getSuggestions(prefix, cbId);
}

window.iceOnSuggestions = function (json, cbId) {
    var cb = callbacks[cbId];
    if (cb) {
        delete callbacks[cbId];
        cb(json);
    }
};

function highlightPrefix(text, query) {
    text = String(text === undefined || text === null ? '' : text);
    if (!query) return escapeHtml(text);
    var lower = text.toLowerCase();
    var q = query.toLowerCase();
    var idx = lower.indexOf(q);
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.substring(0, idx)) + '<mark>' + escapeHtml(text.substring(idx, idx + query.length)) + '</mark>' + escapeHtml(text.substring(idx + query.length));
}

function renderSuggestions(list) {
    var sug = document.getElementById('suggestions');
    if (!sug) return;
    var input = document.getElementById('searchInput');
    var query = input ? input.value : '';

    if (!list || !list.length) {
        sug.innerHTML = '';
        sug.classList.remove('show');
        sugItems = [];
        sugIndex = -1;
        return;
    }

    sugItems = list;
    sugIndex = -1;
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var s = String(list[i]);
        var looksUrl = /^[\w-]+\./.test(s) && !/\s/.test(s);
        html += '<div class="suggestion-item" role="option" data-idx="' + i + '" onclick="pickSuggestion(' + i + ')">' +
            '<div class="suggestion-icon">' + (looksUrl ?
                '<svg viewBox="0 0 24 24"><path d="M3.9,12C3.9,10.29 5.29,8.9 7,8.9H11V7H7A5,5 0 0,0 2,12A5,5 0 0,0 7,17H11V15.1H7C5.29,15.1 3.9,13.71 3.9,12M8,13H16V11H8V13M17,7H13V8.9H17A3.1,3.1 0 0,1 20.1,12A3.1,3.1 0 0,1 17,15.1H13V17H17A5,5 0 0,0 22,12A5,5 0 0,0 17,7Z"/></svg>' :
                '<svg viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C7,12 7,12 7.44,13.27L9.5,15C10.59,15 11.65,14.61 12.46,13.95L12.85,13.06L13.06,12.85L13.95,12.46C14.61,11.65 15,10.59 15,9.5C15,7 13,5 9.5,5Z"/></svg>') + '</div>' +
            '<div class="suggestion-text">' + highlightPrefix(s, query) + '</div>' +
            (looksUrl ? '<div class="suggestion-type">网址</div>' : '') +
            '</div>';
    }
    sug.innerHTML = html;
    sug.classList.add('show');
}

function resetSuggestionIndex() {
    sugIndex = -1;
    var items = document.querySelectorAll('#suggestions .suggestion-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
}

function onSearchKeydown(e) {
    var key = e.key;
    if (key === 'Escape') {
        hideSuggestions();
        resetSuggestionIndex();
        return;
    }
    var items = document.querySelectorAll('#suggestions .suggestion-item');
    if (!items.length) {
        if (key === 'Enter') { /* 交给表单提交 */ }
        return;
    }
    if (key === 'ArrowDown') {
        e.preventDefault();
        sugIndex = (sugIndex + 1) % items.length;
        syncSuggestionActive(items);
    } else if (key === 'ArrowUp') {
        e.preventDefault();
        sugIndex = sugIndex <= 0 ? items.length - 1 : sugIndex - 1;
        syncSuggestionActive(items);
    } else if (key === 'Enter') {
        if (sugIndex >= 0 && sugIndex < items.length) {
            e.preventDefault();
            pickSuggestion(sugIndex);
        }
    }
}

function syncSuggestionActive(items) {
    for (var i = 0; i < items.length; i++) {
        if (i === sugIndex) items[i].classList.add('active');
        else items[i].classList.remove('active');
    }
}

function pickSuggestion(idx) {
    var text = sugItems[idx];
    if (text === undefined || text === null) return;
    var input = document.getElementById('searchInput');
    if (input) input.value = text;
    hideSuggestions();
    resetSuggestionIndex();
    doSearch();
}

function hideSuggestions() {
    var sug = document.getElementById('suggestions');
    if (sug) sug.classList.remove('show');
}

document.addEventListener('click', function (e) {
    var t = e.target;
    var inside = false;
    while (t && t !== document) {
        if (t.className && typeof t.className === 'string' && t.className.indexOf('search-container') !== -1) { inside = true; break; }
        t = t.parentNode;
    }
    if (!inside) hideSuggestions();
});

// ===================== 最近搜索 =====================
function saveRecent() {
    try { localStorage.setItem('ice_recent', JSON.stringify(state.recent)); } catch (e) {}
}

function recordRecent(q) {
    if (state.incognito) return;
    q = (q || '').trim();
    if (!q) return;
    var next = [];
    for (var i = 0; i < state.recent.length; i++) {
        if (state.recent[i] !== q) next.push(state.recent[i]);
    }
    next.unshift(q);
    if (next.length > 12) next = next.slice(0, 12);
    state.recent = next;
    saveRecent();
    renderRecent();
}

function removeRecent(q) {
    if (state.incognito) return;
    var next = [];
    for (var i = 0; i < state.recent.length; i++) {
        if (state.recent[i] !== q) next.push(state.recent[i]);
    }
    state.recent = next;
    saveRecent();
    renderRecent();
}

function clearRecent() {
    if (state.incognito) return;
    state.recent = [];
    saveRecent();
    renderRecent();
    showToast('已清空最近搜索');
}

function renderRecent() {
    var section = document.getElementById('recentSection');
    var list = document.getElementById('recentList');
    if (!section || !list) return;
    if (state.incognito || !state.recent.length) {
        section.style.display = 'none';
        list.innerHTML = '';
        return;
    }
    var html = '';
    for (var i = 0; i < state.recent.length; i++) {
        var q = state.recent[i];
        html += '<button type="button" class="recent-chip" onclick="pickRecent(' + i + ')" aria-label="搜索 ' + escapeHtml(q) + '">' +
            '<span class="recent-text">' + escapeHtml(q) + '</span>' +
            '<span class="recent-del" role="button" tabindex="0" aria-label="删除 ' + escapeHtml(q) + '" onclick="event.stopPropagation();removeRecentAt(' + i + ')">\u00D7</span>' +
            '</button>';
    }
    list.innerHTML = html;
    updateRecentVisibility();
}

function pickRecent(i) {
    var q = state.recent[i];
    if (q === undefined) return;
    var input = document.getElementById('searchInput');
    if (input) input.value = q;
    doSearch();
}

function removeRecentAt(i) {
    var q = state.recent[i];
    if (q === undefined) return;
    removeRecent(q);
}

function updateRecentVisibility() {
    var section = document.getElementById('recentSection');
    if (!section) return;
    var input = document.getElementById('searchInput');
    var hasText = input && input.value.trim().length > 0;
    var show = !state.incognito && !hasText && state.recent.length > 0;
    section.style.display = show ? 'block' : 'none';
}

// ===================== 快捷方式 =====================
function saveShortcuts() {
    try { localStorage.setItem('ice_shortcuts', JSON.stringify(state.shortcuts)); } catch (e) {}
}

function renderShortcuts() {
    var grid = document.getElementById('shortcutsGrid');
    if (!grid) return;
    grid.innerHTML = '';
    for (var i = 0; i < state.shortcuts.length; i++) {
        (function (idx) {
            var s = state.shortcuts[idx];
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'shortcut' + (state.editMode ? ' edit-mode' : '');
            btn.setAttribute('aria-label', '打开 ' + s.name);
            btn.innerHTML = '<span class="shortcut-del" role="button" aria-label="删除 ' + escapeHtml(s.name) + '">\u00D7</span>' +
                '<div class="shortcut-icon" style="background:' + escapeHtml(s.color) + '">' + escapeHtml(s.icon) + '</div>' +
                '<div class="shortcut-name">' + escapeHtml(s.name) + '</div>';
            btn.onclick = function () {
                if (state.editMode) removeShortcut(idx, true);
                else iceNav(s.url);
            };
            var del = btn.querySelector('.shortcut-del');
            if (del) {
                del.onclick = function (ev) {
                    if (ev && ev.stopPropagation) ev.stopPropagation();
                    removeShortcut(idx, false);
                };
            }
            btn.addEventListener('touchstart', function () { startLongPress(idx); });
            btn.addEventListener('touchend', cancelLongPress);
            btn.addEventListener('touchmove', cancelLongPress);
            btn.addEventListener('touchcancel', cancelLongPress);
            grid.appendChild(btn);
        })(i);
    }
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'shortcut add-shortcut';
    add.setAttribute('aria-label', '添加快捷方式');
    add.onclick = addShortcut;
    add.innerHTML = '<div class="shortcut-icon add-shortcut-icon">+</div><div class="shortcut-name">添加</div>';
    grid.appendChild(add);
}

function startLongPress(idx) {
    cancelLongPress();
    longPressTimer = setTimeout(function () {
        longPressTimer = null;
        removeShortcut(idx, false);
    }, 650);
}

function cancelLongPress() {
    if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
    }
}

function removeShortcut(idx, silent) {
    if (idx < 0 || idx >= state.shortcuts.length) return;
    state.shortcuts.splice(idx, 1);
    saveShortcuts();
    renderShortcuts();
    if (!silent) showToast('已删除快捷方式');
}

function toggleEditMode() {
    state.editMode = !state.editMode;
    var el = document.getElementById('edit_link');
    if (el) el.textContent = state.editMode ? '完成' : '编辑';
    renderShortcuts();
    showToast(state.editMode ? '点击站点移除，点 + 添加' : '已退出编辑');
}

function addShortcut() {
    var url = prompt('网址（例：example.com）');
    if (!url) return;
    var guess = String(url).replace(/^https?:\/\//i, '').split('/')[0];
    var name = prompt('名称', guess) || guess || '新网站';
    var icon = String(name).charAt(0).toUpperCase();
    var color = '#' + pad6(Math.random() * 16777215);
    state.shortcuts.unshift({ name: name, url: normalizeUrl(url), icon: icon, color: color });
    saveShortcuts();
    renderShortcuts();
    showToast('已添加快捷方式');
}

// ===================== 抽屉 =====================
function toggleDrawer() {
    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawerOverlay');
    if (!drawer || !overlay) return;
    var open = !drawer.classList.contains('show');
    if (open) {
        drawer.classList.add('show');
        overlay.classList.add('show');
        loadDrawerPreviews();
    } else {
        closeDrawer();
    }
}

function closeDrawer() {
    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawerOverlay');
    if (drawer) drawer.classList.remove('show');
    if (overlay) overlay.classList.remove('show');
}

function loadDrawerPreviews() {
    renderDrawerPreview('drawerHistorySection', 'drawerHistory', 'history');
    renderDrawerPreview('drawerBookmarkSection', 'drawerBookmarks', 'bookmarks');
}

function renderDrawerPreview(sectionId, listId, kind) {
    var section = document.getElementById(sectionId);
    var list = document.getElementById(listId);
    if (!section || !list) return;
    var items = [];
    var method = kind === 'history' ? 'getHistory' : 'getBookmarks';
    if (isNative(method)) {
        try {
            items = JSON.parse(window.IceJsBridge[method]() || '[]');
        } catch (e) { items = []; }
    }
    if (!items || !items.length) {
        section.style.display = 'none';
        list.innerHTML = '';
        return;
    }
    var html = '';
    var limit = Math.min(items.length, 5);
    for (var i = 0; i < limit; i++) {
        var it = items[i] || {};
        var url = it.url || '';
        if (!url) continue;
        var title = it.title || url;
        html += '<button type="button" class="drawer-list-item" onclick="iceNav(\'' + escapeHtml(url) + '\')" aria-label="打开 ' + escapeHtml(title) + '">' +
            escapeHtml(title) +
            '</button>';
    }
    if (!html) {
        section.style.display = 'none';
        return;
    }
    list.innerHTML = html;
    section.style.display = 'block';
}

// ===================== 书签状态 =====================
function updateBookmarkState() {
    var btn = document.getElementById('bmBtn');
    var label = document.getElementById('drawerBookmarkLabel');
    var on = false;
    if (isNative('isBookmarked')) {
        try { on = !!window.IceJsBridge.isBookmarked(); } catch (e) {}
    }
    if (btn) {
        if (on) btn.classList.add('bm-on');
        else btn.classList.remove('bm-on');
    }
    var path = document.getElementById('bmPath');
    if (path) {
        path.setAttribute('d', on ?
            'M17,3H7C5.89,3 5,3.9 5,5V21L12,18L19,21V5C19,3.9 18.11,3 17,3Z' :
            'M17,3H7C5.89,3 5,3.9 5,5V21L12,18L19,21V5C19,3.9 18.11,3 17,3M17,5V18L12,15.82L7,18V5H17Z');
    }
    if (label) label.textContent = on ? '已收藏（点击移除）' : '添加书签';
}

function toggleBookmark() {
    var on = false;
    if (isNative('isBookmarked')) {
        try { on = !!window.IceJsBridge.isBookmarked(); } catch (e) {}
    }
    if (on) {
        if (isNative('removeBookmark')) window.IceJsBridge.removeBookmark();
        showToast('已移除书签');
    } else {
        if (isNative('addBookmark')) window.IceJsBridge.addBookmark();
        showToast('已添加书签');
    }
    setTimeout(updateBookmarkState, 150);
    closeDrawer();
}

// ===================== Tab 计数 =====================
function updateTabCount(n) {
    n = (n === undefined || n === null) ? 1 : n;
    var el = document.getElementById('tab_count');
    if (el) el.textContent = n;
    var el2 = document.getElementById('tab_count_drawer');
    if (el2) el2.textContent = n;
}

// ===================== URL 参数 =====================
function parseLocationParams() {
    var out = {};
    var qs = window.location.search || '';
    if (qs.charAt(0) === '?') qs = qs.substring(1);
    if (!qs) return out;
    var pairs = qs.split('&');
    for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i]) continue;
        var eq = pairs[i].indexOf('=');
        var k, v;
        if (eq === -1) { k = pairs[i]; v = ''; }
        else { k = pairs[i].substring(0, eq); v = pairs[i].substring(eq + 1); }
        try { out[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); }
        catch (e) { out[k] = v; }
    }
    return out;
}

function applyIncognito(on) {
    state.incognito = !!on;
    if (state.incognito) {
        document.body.classList.add('incognito');
        var sub = document.getElementById('drawerSubtitle');
        if (sub) sub.textContent = 'v5.0 · 无痕模式 · 不记录搜索';
    } else {
        document.body.classList.remove('incognito');
    }
    renderRecent();
    updateRecentVisibility();
}

// ===================== 启动 =====================
function init() {
    syncSearchEngine();
    renderShortcuts();

    initTheme();

    var params = parseLocationParams();
    var incognito = (params.mode === 'incognito');
    if (!incognito && isNative('isIncognito')) {
        try { incognito = !!window.IceJsBridge.isIncognito(); } catch (e) {}
    }
    applyIncognito(incognito);

    renderRecent();
    updateTabCount(isNative('getTabCount') ? window.IceJsBridge.getTabCount() : 1);
    updateBookmarkState();

    // 桌面端才自动聚焦，避免移动端弹出键盘
    try {
        if (window.matchMedia && window.matchMedia('(min-width: 768px)').matches) {
            var input = document.getElementById('searchInput');
            if (input) input.focus();
        }
    } catch (e) {}

    // ?q= 自动搜索
    if (params.q) {
        var input2 = document.getElementById('searchInput');
        if (input2) input2.value = params.q;
        doSearch();
    }
}

init();
</script>
